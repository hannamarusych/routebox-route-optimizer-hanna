# Minimal pyproject.toml — for tooling config only. We do NOT use this to
# manage runtime dependencies; that's requirements.txt's job. Splitting
# was a deliberate choice when poetry was breaking our Jenkins agents in
# subtle ways and we couldn't be bothered to debug it.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line-too-long — we have a few SQL strings that aren't worth wrapping
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.black]
line-length = 100
target-version = ["py310"]
